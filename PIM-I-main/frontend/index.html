<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoramento de Água</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Monitoramento de Consumo de Água</h1>

        <form id="houseForm">
            <h2>Cadastro de Residência</h2>
            <label>Nome da Rua:</label>
            <input type="text" id="streetName" required>

            <label>Número da Casa:</label>
            <input type="text" id="houseNumber" required>

            <label>Consumo médio de água por dia (litros):</label>
            <input type="number" id="dailyWaterUsage" required>

            <button type="submit">Cadastrar</button>
        </form>

        <div class="reservoir-status">
            <h2>Status do Reservatório</h2>
            <p id="reservoirData">Carregando dados...</p>
            <button id="refreshBtn">Atualizar Reservatório</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
